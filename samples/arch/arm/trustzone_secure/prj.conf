# Secure-side configuration for the trustzone_secure sample.

CONFIG_ARM_SECURE_FIRMWARE=y

# SAU region programming from device tree
CONFIG_ARM_SAU_DT=y

# AIRCR security hardening
CONFIG_ARM_TZ_AIRCR_BFHFNMINS=y
CONFIG_ARM_TZ_AIRCR_PRIS=y
CONFIG_ARM_TZ_AIRCR_SYSRESETREQS=y

# Prevent Secure thread re-entry via SG
CONFIG_ARM_TZ_CCR_S_TRD=y

# Enforce Non-Secure caller check at entry functions
CONFIG_ARM_TZ_CMSE_NONSECURE_CALLER_CHECK=y

# Enable entry veneers (the SG stub library)
CONFIG_ARM_FIRMWARE_HAS_SECURE_ENTRY_FUNCS=y

# Track per-thread call activity
CONFIG_ARM_TZ_CALL_ACTIVE_TRACKING=y

# Printk for diagnostics
CONFIG_PRINTK=y
