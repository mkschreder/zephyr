CONFIG_ZTEST=y
CONFIG_ZTEST_NEW_API=y

# Require Secure firmware context
CONFIG_ARM_SECURE_FIRMWARE=y

# Enable ESF extra_info so secure_fault_status / secure_fault_address exist
CONFIG_EXTRA_EXCEPTION_INFO=y

# Enable the recoverable-fault hook infrastructure (see p2-recovery)
CONFIG_ARM_TZ_SECURE_FAULT_HOOK=y
